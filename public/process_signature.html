<!DOCTYPE html>
<html>
<head><title>Process Signature v3</title></head>
<body>
<h2>Signature Processor v3</h2>
<p>Original (on white bg):</p>
<img id="original" style="border: 1px solid red; width: 300px; background: white;">
<p>Processed (on white bg):</p>
<canvas id="canvas" style="border: 1px solid green; background: white;"></canvas>
<br><br>
<p>Processed (on blue bg - simulating stamp):</p>
<canvas id="canvas2" style="border: 1px solid blue; background: #1a5276; width: 300px;"></canvas>
<script>
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = function() {
    document.getElementById('original').src = img.src;
    
    const canvas = document.getElementById('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    
    // Pixel analysis
    let histogram = {};
    for (let i = 0; i < data.length; i += 4) {
        const brightness = Math.round((data[i] + data[i+1] + data[i+2]) / 3);
        histogram[brightness] = (histogram[brightness] || 0) + 1;
    }
    // Log top brightness values
    const sorted = Object.entries(histogram).sort((a,b) => b[1]-a[1]);
    console.log('TOP_BRIGHTNESS_VALUES:', JSON.stringify(sorted.slice(0, 20)));
    
    // Find ink threshold dynamically
    // Most pixels should be near 0 (black bg), ink pixels will be slightly brighter
    let totalPixels = data.length / 4;
    let bgPixels = 0;
    for (let b = 0; b <= 5; b++) {
        bgPixels += (histogram[b] || 0);
    }
    console.log('BG_PIXELS (0-5):', bgPixels, 'of', totalPixels, '=', (bgPixels/totalPixels*100).toFixed(1) + '%');
    
    // Make ink visible: anything above brightness 5 is ink
    for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        const brightness = (r + g + b) / 3;
        
        if (brightness > 5) {
            // INK - make solid black, opacity proportional to brightness
            data[i] = 0;
            data[i+1] = 0;
            data[i+2] = 0;
            data[i+3] = Math.min(255, Math.round(brightness * 8));
        } else {
            // BACKGROUND - transparent
            data[i] = 0;
            data[i+1] = 0;
            data[i+2] = 0;
            data[i+3] = 0;
        }
    }
    
    ctx.putImageData(imageData, 0, 0);
    
    // Copy to blue bg canvas for preview
    const canvas2 = document.getElementById('canvas2');
    canvas2.width = canvas.width;
    canvas2.height = canvas.height;
    const ctx2 = canvas2.getContext('2d');
    ctx2.fillStyle = '#1a5276';
    ctx2.fillRect(0, 0, canvas2.width, canvas2.height);
    ctx2.drawImage(canvas, 0, 0);
    
    document.title = 'DONE_V3';
    console.log('PROCESSING_COMPLETE_V3');
};
// Load the ORIGINAL jpg, not the already-processed png
img.src = '/signature_manager_original.jpg?v=' + Date.now();
</script>
</body>
</html>
